<!-- Main HTML file for CrisisAid Route Planner -->
<!DOCTYPE html>
<html>
<head>
  <title>CrisisAid Route Planner</title>

  <!-- Link to CSS file -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Title of the application -->
  <h1>CrisisAid Route Planner</h1>

  <div class="container">

    <h2>Find Best Route</h2>

    <!-- Dropdown to select starting location -->
    <label>Start Location:</label>
    <select id="start">
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
    </select>

    <br><br>

    <!-- Dropdown to select ending location -->
    <label>End Location:</label>
    <select id="end">
      <option value="D">D</option>
      <option value="C">C</option>
      <option value="B">B</option>
    </select>

    <br><br>

    <!-- Button triggers JavaScript function -->
    <button onclick="findRoute()">Find Best Route</button>

    <!-- This will display the result -->
    <h3 id="result">Result will appear here</h3>

  </div>

  <!-- Link to JavaScript file -->
  <script src="script.js"></script>

</body>
</html>
